name: Rebuild combined

on:
  schedule:
    - cron: '17 * * * *'   # hourly; does nothing unless an input changed
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild, compile and re-upload the release even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rebuild-combined

env:
  UPSTREAM_URL: https://github.com/SpecialKO/SpecialK.git
  UPSTREAM_BRANCH: main
  TARGET: combined

jobs:
  rebuild:
    runs-on: ubuntu-latest
    outputs:
      sha:     ${{ steps.release.outputs.sha }}
      tag:     ${{ steps.release.outputs.tag }}
      url:     ${{ steps.release.outputs.url }}
      rebuilt: ${{ steps.rebuild.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation
          fetch-depth: 0

      # Hash of everything the result depends on; an unchanged hash skips the run.
      - name: Fingerprint inputs
        id: fp
        run: |
          {
            echo "automation $GITHUB_SHA"
            bash rebuild.sh --list
          } | tee "$RUNNER_TEMP/inputs.txt"
          echo "key=combined-inputs-$(sha256sum "$RUNNER_TEMP/inputs.txt" | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Check whether these inputs were already built
        id: seen
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/inputs.txt
          key: ${{ steps.fp.outputs.key }}
          lookup-only: true

      - name: Rebuild
        id: rebuild
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          PUSH: '1'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash rebuild.sh

      # Saved even after a failed rebuild, so an unresolved conflict fails once
      # instead of every hour. A change to any input (or a forced run) retries.
      - name: Remember these inputs
        if: always() && steps.seen.outputs.cache-hit != 'true' && steps.rebuild.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/inputs.txt
          key: ${{ steps.fp.outputs.key }}

      # Every build of combined is released under the tag combined-<sha8>. If the
      # current combined already has one, link to it instead of building again.
      - name: Look for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILT_SHA: ${{ steps.rebuild.outputs.sha }}
        run: |
          sha=$REBUILT_SHA
          [ -n "$sha" ] || sha=$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)
          if [ -z "$sha" ]; then
            echo "There is no $TARGET branch yet."
            exit 0
          fi
          tag="$TARGET-${sha:0:8}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already built::$TARGET at ${sha:0:8} is already released: $url"
            {
              echo "### ✅ Already built"
              echo "\`$TARGET\` at \`${sha:0:8}\` is already released as [$tag]($url)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.rebuild.outcome }}" != "success" ] && [ "${{ inputs.force }}" != "true" ]; then
            # Nothing changed since the last attempt, which therefore must have
            # failed to compile or release; don't retry (and email) every hour.
            echo "::warning title=No release::$TARGET at ${sha:0:8} has no release and nothing changed since the last attempt. Run the workflow with 'force' to try again."
          fi

  # Pushes made with GITHUB_TOKEN never trigger other workflows, so the fork's
  # own "Builds" workflow does not run for combined. These jobs mirror it.
  # Runs when the current combined has no release yet (after a rebuild that ran),
  # or on a forced manual run.
  build:
    name: Build (${{ matrix.platform }})
    needs: rebuild
    if: needs.rebuild.outputs.sha != '' && (inputs.force || (needs.rebuild.outputs.url == '' && needs.rebuild.outputs.rebuilt == 'true'))
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebuild.outputs.sha }}

      - uses: SpecialKO/GA-setup-cpp-n20@master
      - uses: microsoft/setup-msbuild@v2

      - name: Build combined (${{ matrix.platform }})
        run: msbuild SpecialK.sln -p:Configuration="Release" -p:Platform="${{ matrix.platform }}" -m

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ~\Documents\My Mods\SpecialK\*.dll
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.platform }}
          path: ~\Documents\My Mods\SpecialK\*.pdb
          if-no-files-found: warn
          retention-days: 1

  merge:
    name: Merge artifacts
    needs: [rebuild, build]
    runs-on: windows-2022
    outputs:
      name:        ${{ steps.prep.outputs.name }}
      version:     ${{ steps.prep.outputs.version }}
      has_symbols: ${{ steps.prep.outputs.has_symbols }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: Builds
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: symbols-*
          path: Symbols
          merge-multiple: true

      - name: Name the artifact
        id: prep
        run: |
          $Dll = Get-Item ".\Builds\SpecialK64.dll", ".\Builds\SpecialK*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $Version = if ($Dll) { $Dll.VersionInfo.ProductVersion } else { $null }
          If ([string]::IsNullOrWhiteSpace($Version)) { $Version = "unknown" }
          $Version = $Version.Trim()
          $Name = "SpecialK_combined_$($Version)_$("${{ needs.rebuild.outputs.sha }}".SubString(0, 8))"
          $HasSymbols = [bool](Get-ChildItem ".\Symbols\*.pdb" -ErrorAction SilentlyContinue)
          "name=$Name"       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          "has_symbols=$($HasSymbols.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      - uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.prep.outputs.name }}
          pattern: build-*
          delete-merged: true

      - uses: actions/upload-artifact/merge@v4
        if: steps.prep.outputs.has_symbols == 'true'
        with:
          name: ${{ steps.prep.outputs.name }}_debug_symbols
          pattern: symbols-*
          delete-merged: true

  release:
    name: Publish release
    needs: [rebuild, merge]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA:      ${{ needs.rebuild.outputs.sha }}
      TAG:      ${{ needs.rebuild.outputs.tag }}
      NAME:     ${{ needs.merge.outputs.name }}
      VERSION:  ${{ needs.merge.outputs.version }}
    steps:
      # Enough history to walk combined's merge commits back to upstream.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebuild.outputs.sha }}
          fetch-depth: 200

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge.outputs.name }}
          path: ${{ runner.temp }}/dll

      - uses: actions/download-artifact@v4
        if: needs.merge.outputs.has_symbols == 'true'
        with:
          name: ${{ needs.merge.outputs.name }}_debug_symbols
          path: ${{ runner.temp }}/pdb

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/dll" && zip -9 -q "$RUNNER_TEMP/assets/$NAME.zip" *)
          if [ -d "$RUNNER_TEMP/pdb" ]; then
            (cd "$RUNNER_TEMP/pdb" && zip -9 -q "$RUNNER_TEMP/assets/${NAME}_debug_symbols.zip" *)
          fi
          ls -l "$RUNNER_TEMP/assets"

      - name: Write release notes
        run: |
          re="^Merge branch '(.+)' into $TARGET\$"
          c=$SHA
          branches=""
          while subject=$(git log -1 --format=%s "$c") && [[ $subject =~ $re ]]; do
            tip=$(git rev-parse "$c^2")
            branches="- [\`${BASH_REMATCH[1]}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$tip) @ \`${tip:0:8}\`: $(git log -1 --format=%s "$tip")"$'\n'"$branches"
            c=$(git rev-parse "$c^1")
          done
          upstream=${UPSTREAM_URL%.git}
          {
            echo "Automated build of [\`$TARGET\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$TAG) at \`${SHA:0:8}\`: Special K $VERSION."
            echo
            echo "**Base:** [${upstream#https://github.com/}]($upstream) \`$UPSTREAM_BRANCH\` @ [\`$(git rev-parse --short=8 "$c")\`]($upstream/commit/$(git rev-parse "$c")): $(git log -1 --format=%s "$c")"
            echo
            echo "**Branches merged, in order:**"
            echo
            printf '%s' "$branches"
            echo
            echo "**Downloads:** \`$NAME.zip\` holds the 32-bit and 64-bit DLLs; \`${NAME}_debug_symbols.zip\` holds the matching PDBs."
          } | tee "$RUNNER_TEMP/notes.md"

      # A forced run of an already released build replaces its assets and notes.
      - name: Publish
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/assets/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit   "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/assets/*.zip \
              --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
              --title "Special K combined $VERSION (${SHA:0:8})" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "::notice title=Released::$url"
          {
            echo "### 🚀 Released"
            echo "[$TAG]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
